name: Release

on:
  push:
    tags:
      - 'v*'
  # 手動でビルドを実行できるようにする
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.platform.os }}
    # コミットメッセージに [skip ci] が含まれている場合は実行しない
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: Softveil-macOS-arm64.zip
          - os: windows-latest
            asset_name: Softveil-Windows-x64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust (MSVC for Windows / Darwin for macOS)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target || 'x86_64-pc-windows-msvc' }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build binary (macOS)
        if: matrix.platform.os == 'macos-latest'
        run: cargo build --release --target ${{ matrix.platform.target }}

      - name: Build binary (Windows MSVC)
        if: matrix.platform.os == 'windows-latest'
        id: build_msvc
        continue-on-error: true
        run: |
          cargo build --release --target x86_64-pc-windows-msvc
          echo "target=x86_64-pc-windows-msvc" >> $GITHUB_OUTPUT
        shell: bash

      - name: Install GNU target (Windows Fallback)
        if: matrix.platform.os == 'windows-latest' && steps.build_msvc.outcome == 'failure'
        run: rustup target add x86_64-pc-windows-gnu

      - name: Build binary (Windows GNU Fallback)
        if: matrix.platform.os == 'windows-latest' && steps.build_msvc.outcome == 'failure'
        id: build_gnu
        run: |
          cargo build --release --target x86_64-pc-windows-gnu
          echo "target=x86_64-pc-windows-gnu" >> $GITHUB_OUTPUT
        shell: bash

      - name: Set Windows Final Target
        if: matrix.platform.os == 'windows-latest'
        id: win_target
        run: |
          if [ "${{ steps.build_msvc.outcome }}" == "success" ]; then
            echo "val=x86_64-pc-windows-msvc" >> $GITHUB_OUTPUT
          else
            echo "val=x86_64-pc-windows-gnu" >> $GITHUB_OUTPUT
          fi
        shell: bash

      # macOS specific: Create .app bundle (Apple Silicon only)
      - name: Bundle macOS App
        if: matrix.platform.os == 'macos-latest'
        run: |
          mkdir -p Softveil.app/Contents/MacOS
          mkdir -p Softveil.app/Contents/Resources
          cp target/${{ matrix.platform.target }}/release/softveil Softveil.app/Contents/MacOS/
          chmod +x Softveil.app/Contents/MacOS/softveil
          cp package/macos/Info.plist Softveil.app/Contents/
          cp assets/icon_macos.icns Softveil.app/Contents/Resources/
          # Ad-hoc sign the binary to satisfy Gatekeeper basics
          codesign --force --deep --sign - Softveil.app
          zip -r ${{ matrix.platform.asset_name }} Softveil.app

      # Windows specific: Zip .exe
      - name: Bundle Windows App
        if: matrix.platform.os == 'windows-latest'
        run: |
          mkdir dist
          cp target/${{ steps.win_target.outputs.val }}/release/softveil.exe dist/
          compress-archive -Path dist/* -DestinationPath ${{ matrix.platform.asset_name }}
        shell: pwsh

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.platform.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
