name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build - ${{ matrix.platform.os }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: macos-latest
            asset_name: Softveil-macOS.zip
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: Softveil-Windows.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target || 'aarch64-apple-darwin,x86_64-apple-darwin' }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # macOS specific: Build both targets and lipo
      - name: Build macOS Universal Binary
        if: matrix.platform.os == 'macos-latest'
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          mkdir -p Softveil.app/Contents/MacOS
          mkdir -p Softveil.app/Contents/Resources
          lipo -create target/x86_64-apple-darwin/release/softveil target/aarch64-apple-darwin/release/softveil -output Softveil.app/Contents/MacOS/softveil
          cp package/macos/Info.plist Softveil.app/Contents/
          cp assets/icon_macos.icns Softveil.app/Contents/Resources/
          cp assets/face_detector.onnx Softveil.app/Contents/Resources/
          zip -r ${{ matrix.platform.asset_name }} Softveil.app

      # Windows specific: Build and zip
      - name: Build Windows App
        if: matrix.platform.os == 'windows-latest'
        run: |
          cargo build --release --target ${{ matrix.platform.target }}
          mkdir dist
          cp target/${{ matrix.platform.target }}/release/softveil.exe dist/
          cp assets/face_detector.onnx dist/
          compress-archive -Path dist/* -DestinationPath ${{ matrix.platform.asset_name }}
        shell: pwsh

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.platform.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
