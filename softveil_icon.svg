<svg width="1024" height="1024" viewBox="0 0 1024 1024" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Softveil app icon</title>
<desc>Monitor outline with a semi-transparent veil layer, on a light neutral background</desc>
<defs>
  <clipPath id="icon-clip">
    <rect x="0" y="0" width="1024" height="1024" rx="224"/>
  </clipPath>
</defs>

<rect x="0" y="0" width="1024" height="1024" rx="224" fill="#f2f2f2"/>

<g clip-path="url(#icon-clip)">
  <!-- monitor body -->
  <rect x="168" y="220" width="688" height="490" rx="28"
        fill="none" stroke="#2e2e2e" stroke-width="42" stroke-linejoin="round"/>

  <!-- stand -->
  <line x1="390" y1="710" x2="390" y2="808" stroke="#2e2e2e" stroke-width="38" stroke-linecap="round"/>
  <line x1="634" y1="710" x2="634" y2="808" stroke="#2e2e2e" stroke-width="38" stroke-linecap="round"/>
  <line x1="340" y1="808" x2="684" y2="808" stroke="#2e2e2e" stroke-width="38" stroke-linecap="round"/>

  <!-- veil overlay (lower half of screen) -->
  <rect x="168" y="455" width="688" height="255" rx="0"
        fill="#2e2e2e" fill-opacity="0.10"/>
  <!-- veil top edge dashed line -->
  <line x1="168" y1="455" x2="856" y2="455"
        stroke="#2e2e2e" stroke-opacity="0.30" stroke-width="7" stroke-dasharray="20 13"/>

  <!-- content lines (upper area of screen) -->
  <line x1="228" y1="314" x2="560" y2="314" stroke="#2e2e2e" stroke-opacity="0.18" stroke-width="26" stroke-linecap="round"/>
  <line x1="228" y1="374" x2="460" y2="374" stroke="#2e2e2e" stroke-opacity="0.11" stroke-width="26" stroke-linecap="round"/>
</g>
</svg>
